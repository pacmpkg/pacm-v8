name: Release Publish

on:
  release:
    types:
      - created
      - published

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out release target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0

      - name: Extract crate version
        id: crate_version
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v8-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify V8 prebuilt assets exist
        id: verify_assets
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        with:
          script: |
            const tagName = process.env.TAG_NAME;
            
            // Wait and retry logic to handle asset upload timing
            const maxRetries = 10;
            const retryDelay = 30000; // 30 seconds
            
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
              try {
                // Get release by tag
                const response = await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: tagName,
                });
                const release = response.data;
                
                // Check if release has any assets
                if (!release.assets || release.assets.length === 0) {
                  if (attempt < maxRetries) {
                    core.info(
                      `Release ${tagName} has no assets yet (attempt ${attempt}/${maxRetries}). ` +
                      `Waiting ${retryDelay/1000}s for assets to be uploaded...`
                    );
                    await new Promise(resolve => setTimeout(resolve, retryDelay));
                    continue;
                  } else {
                    core.setFailed(
                      `Release ${tagName} exists but has no assets after ${maxRetries} attempts. ` +
                      `V8 prebuilt artifacts must be uploaded before publishing the crate.`
                    );
                    return;
                  }
                }
                
                // Check for expected V8 prebuilt archives
                const assetNames = release.assets.map(a => a.name);
                const expectedPatterns = ['v8-', '.tar.gz'];
                const hasV8Assets = assetNames.some(name => 
                  expectedPatterns.every(pattern => name.includes(pattern))
                );
                
                if (!hasV8Assets) {
                  if (attempt < maxRetries) {
                    core.info(
                      `Release ${tagName} assets may not include V8 prebuilt binaries yet (attempt ${attempt}/${maxRetries}). ` +
                      `Found assets: ${assetNames.join(', ')}. Waiting ${retryDelay/1000}s...`
                    );
                    await new Promise(resolve => setTimeout(resolve, retryDelay));
                    continue;
                  } else {
                    core.warning(
                      `Release ${tagName} may not have all V8 prebuilt binaries after ${maxRetries} attempts. ` +
                      `Found assets: ${assetNames.join(', ')}`
                    );
                  }
                }
                
                core.info(`Found V8 prebuilt assets: ${assetNames.filter(n => n.includes('v8-')).join(', ')}`);
                core.setOutput('asset_count', release.assets.length);
                return;
                
              } catch (error) {
                if (error.status === 404 && attempt < maxRetries) {
                  core.info(
                    `Release ${tagName} not found yet (attempt ${attempt}/${maxRetries}). ` +
                    `Waiting ${retryDelay/1000}s...`
                  );
                  await new Promise(resolve => setTimeout(resolve, retryDelay));
                  continue;
                }
                core.setFailed(`Failed to verify release ${tagName}: ${error.message}`);
                return;
              }
            }

      - name: Update crate version references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "${{ steps.crate_version.outputs.version }}"

          cargo_path = Path("Cargo.toml")
          lines = cargo_path.read_text().splitlines()
          in_package = False
          for idx, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("["):
                  in_package = stripped == "[package]"
              elif in_package and stripped.startswith("version"):
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[idx] = f"{indent}version = \"{version}\""
                  break
          else:
              raise SystemExit("Version field not found in [package]")
          cargo_path.write_text("\n".join(lines) + "\n")

          readme_path = Path("README.md")
          readme_text = readme_path.read_text()
          updated_text, count = re.subn(
              r"(pacm-v8\s*=\s*\")([^\"]+)(\")",
              lambda match: f"{match.group(1)}{version}{match.group(3)}",
              readme_text,
              count=1,
          )
          if count == 0:
              raise SystemExit("Version string not found in README.md manual setup section")
          readme_path.write_text(updated_text)
          PY

      - name: Commit version bump
        id: commit_version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "commit_made=false" >> "$GITHUB_OUTPUT"
          else
            git add Cargo.toml Cargo.lock README.md
            git commit -m "chore: update crate version to ${{ steps.crate_version.outputs.version }}"
            echo "commit_made=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit_version.outputs.commit_made == 'true'
        run: |
          git push origin HEAD:${{ github.event.release.target_commitish }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build crate
        run: cargo build --release

      - name: Publish to crates.io
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish --token "$CRATES_IO_API_TOKEN"
